services:
  - type: web
    name: signaltech
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTACT
        value: mailto:admin@example.com
